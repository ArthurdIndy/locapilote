# Tests lancés à chaque pull request (et à chaque mise à jour de main) :
# tests du moteur (Vitest), vérification du code, build, puis tests de parcours (Playwright)
# sur ordinateur et sur téléphone. Les captures d'écran et le rapport sont joints au run.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Tests du moteur (Vitest)
        run: npm test
      - name: Vérification du code
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Navigateur pour les tests de parcours
        run: npx playwright install --with-deps chromium
      - name: Tests de parcours (Playwright)
        run: npm run test:e2e
      - name: Rapport et captures d'écran
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: recette-playwright
          path: |
            playwright-report/
            e2e-captures/
          retention-days: 14
